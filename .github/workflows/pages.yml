name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Souběžné deploye se nemají přebíjet, ale rozdělaný deploy se nepřerušuje.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Nainstalovat nbconvert
        run: pip install nbconvert nbclient ipykernel

      # Jekyll .ipynb neumí — převedeme je na Markdown a přitom spustíme,
      # aby byly na webu vidět i výstupy buněk. Chyba v notebooku s řešením
      # tady build shodí, takže z tohohle kroku je zároveň test.
      - name: Převést notebooky na Markdown
        run: python convert_notebooks.py

      - name: Vygenerovat rozcestník
        run: python generate_index.py

      - name: Nastavit Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # enablement: zapne Pages přes API, kdyby nebylo zapnuté v Settings ručně
      - name: Nastavit Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sestavit Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata jinak tahá z API neautentizovaně a naráží na limit
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}

      - name: Nahrát artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasadit
        id: deployment
        uses: actions/deploy-pages@v4
